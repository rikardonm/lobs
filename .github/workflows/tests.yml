name: Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        container: python:3.12
        steps:
        - uses: actions/checkout@v4
        - name: "Install dependencies"
          run: |
            pip install pytest
            python -m pip install --upgrade pip
            pip install -e .
        - name: "Run tests"
          run: pytest
    build-cmake:
        runs-on: ubuntu-latest
        container: python:3.12
        steps:
        - uses: actions/checkout@v4
        - name: "Install dependencies"
          run: |
            pip install cmake
            python -m pip install --upgrade pip
            pip install -e .
        - name: "Build CMake project"
          run: |
            mkdir build
            cd build
            cmake ../examples/esp-blinky
            cmake --build .
    build-esp:
        runs-on: ubuntu-latest
        container:
          image: espressif/idf:release-v5.5
        steps:
        - uses: actions/checkout@v4
        - name: "Install dependencies"
          run: |
            python -m pip install --upgrade pip
            pip install -e .
        - name: "Build ESP-IDF project"
          run: |
            cd examples/esp-blinky
            idf.py build
